# PostgreSQL 18 para desenvolvimento local: docker compose up -d
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apptic_dev
    ports:
      - "5432:5432"
    volumes:
      - apptic-pg:/var/lib/postgresql
volumes:
  apptic-pg:
